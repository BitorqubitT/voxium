[package]
name = "dicom_viewer"
version = "0.1.0"
edition = "2021"

[dependencies]
dicom = "0.9.0"
dicom-dump = "0.9.0"
dicom-object = "0.9.0"
dicom-pixeldata = { version = "0.9.0", features = ["image"] }
egui = "0.34.3"
egui_extras = { version = "0.34.3", features = ["image", "all_loaders"]}
env_logger = "0.11.9"
image = "0.25.9"
ndarray = "0.17.2"
tags = "0.1.0"
wgpu = "29.0.1"
windows = "=0.62.2"
windows-core = "=0.62.2"
bytemuck = { version = "1", features = ["derive"] }
winit = "0.30.13"
anyhow = "1.0.102"
pollster = "0.4.0"
egui-wgpu = "0.34.3"
egui-winit = "0.34.3"
rfd = "0.17.2"
